[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambulance-route-optimization"
version = "1.0.0"
description = "Emergency Medical Vehicle Routing & Minimum Travel-Time Optimization on Bengaluru Arterial Network"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ambulance Routing Systems Lab" }
]
keywords = [
    "operations-research",
    "shortest-path",
    "dijkstra",
    "ambulance-routing",
    "gis",
    "folium",
    "bengaluru",
    "traffic-signals"
]
dependencies = [
    "networkx>=3.2.1",
    "scipy>=1.13.1",
    "pulp>=2.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "folium>=0.17.0",
    "streamlit-folium>=0.20.0",
    "geopandas>=1.0.0",
    "osmnx>=2.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyogrio>=0.7.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "pydeck>=0.8.0",
    "Pillow>=10.0.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "pdfminer.six>=20231228",
    "opencv-python>=4.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "components*"]
